[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "double11-list"
version = "0.1.0"
description = "双11比价清单：手动录价、叠券后实付计算、预算提醒，数据全本地 | Double 11 shopping list with local price math"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
double11 = "shoppinglist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shoppinglist"]
